name: Patterned CAH from initial contact-line history
on:
  push:
    branches: [research/full-history-patterned-cah]
    paths:
      - 'research/fullhistory*.m'
      - 'research/test_fullhistory*.m'
      - 'research/PHYSICS_FULL_HISTORY.md'
      - '.github/workflows/full-history-patterned-cah.yml'
  workflow_dispatch:
jobs:
  full-history-original-beam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y octave
      - name: Reproduce full patterned history
        run: octave --quiet --no-gui --eval "run('research/test_fullhistory_linear.m')"
      - name: Validate nonlinear angle-cubed law in its low-speed regime
        run: octave --quiet --no-gui --eval "run('research/test_fullhistory_cox.m')"
  conservative-energy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Verify static force equals derivative of exact beam energy
        run: python research/energy_yield_identity.py