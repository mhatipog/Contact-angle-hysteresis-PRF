name: Commensurability research benchmark

on:
  push:
    branches: [research/spectral-commensurability]
    paths:
      - 'research/commensurability/**'
      - '.github/workflows/spectral-commensurability.yml'
  workflow_dispatch:

jobs:
  reduced-model-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' pytest
      - name: Validate exact filters, elastic asymptotics and depinning exponents
        run: python -m pytest -q research/commensurability
