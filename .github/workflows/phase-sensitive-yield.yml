name: Phase-sensitive original PDE pilot
on:
  push:
    branches: [research/phase-sensitive-yield]
    paths:
      - research/phase_sensitive_yield.m
      - research/PHASE_SENSITIVE_YIELD.md
      - .github/workflows/phase-sensitive-yield.yml
  workflow_dispatch:
jobs:
  patterned-boundary-and-first-passage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y octave
      - name: Validate phase-dependent yield response using original PDE
        run: octave --quiet --no-gui --eval "run('research/phase_sensitive_yield.m')"
      - name: Validate opposite-phase release switch against exact beam equilibrium
        run: octave --quiet --no-gui --eval "run('research/test_patterned_phase_transition.m')"
      - name: Audit release time step sensitivity
        run: octave --quiet --no-gui --eval "run('research/patterned_event_convergence.m')"
  implicit-equilibrium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Verify critical amplitude from implicit 4x4 sensitivity
        run: python research/pattern_implicit_sensitivity.py
